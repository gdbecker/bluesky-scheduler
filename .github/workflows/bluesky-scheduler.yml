name: Bluesky Scheduler

on:
  schedule:
    # Morning posting window: 9:17-9:42 AM Eastern
    - cron: "17-42/5 9 * * *"
      timezone: "America/New_York"

    # Afternoon posting window: 3:02-3:27 PM Eastern
    - cron: "2-27/5 15 * * *"
      timezone: "America/New_York"

    # Backup checks: 12:07 PM and 6:07 PM Eastern
    - cron: "7 12,18 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky-scheduler
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Post due Bluesky posts
        run: npm run post-due
        env:
          BLUESKY_GDD_IDENTIFIER: ${{ secrets.BLUESKY_GDD_IDENTIFIER }}
          BLUESKY_GDD_APP_PASSWORD: ${{ secrets.BLUESKY_GDD_APP_PASSWORD }}
          BLUESKY_EDGE_IDENTIFIER: ${{ secrets.BLUESKY_EDGE_IDENTIFIER }}
          BLUESKY_EDGE_APP_PASSWORD: ${{ secrets.BLUESKY_EDGE_APP_PASSWORD }}

      - name: Commit posted status updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mark Bluesky posts as posted"
          file_pattern: posts/**/*.json
